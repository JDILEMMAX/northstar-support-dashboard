<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Support</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Northstar Support</h1>
            <p>How can we help you today?</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'TrackOrder')">Track Order</button>
            <button class="tab-button" onclick="openTab(event, 'Returns')">Returns</button>
            <button class="tab-button" onclick="openTab(event, 'StockCheck')">Stock Check</button>
        </div>

        <div id="TrackOrder" class="tab-content active">
            <h2>Track Your Order</h2>
            <form class="ticket-form" onsubmit="event.preventDefault(); fetchOrderStatus();">
    <label for="orderIdInput">Order ID</label>
    <div class="input-group">
        <input
            type="text"
            id="orderIdInput"
            placeholder="Enter Order ID"
            required
        >
        <button type="submit">Track</button>
    </div>
</form>
            <div id="orderResult" class="result-card hidden"></div>
        </div>

        <div id="Returns" class="tab-content hidden">
            <h2>Process a Return</h2>
<form class="ticket-form" onsubmit="event.preventDefault(); fetchReturnStatus();">
    <label for="returnOrderIdInput">Order ID</label>
    <div class="input-group">
        <input
            type="text"
            id="returnOrderIdInput"
            placeholder="Enter Order ID"
            required
        >
        <button type="submit">Check Status</button>
    </div>
</form>
            <div id="returnResult" class="result-card hidden"></div>
        </div>

        <div id="StockCheck" class="tab-content hidden">
            <h2>Check Stock Availability</h2>
<form class="ticket-form" onsubmit="event.preventDefault(); fetchStock();">
    <label for="skuInput">Product SKU</label>
    <div class="input-group">
        <input
            type="text"
            id="skuInput"
            placeholder="Enter Product SKU"
            required
        >
        <button type="submit">Check</button>
    </div>
</form>
            <div id="stockResult" class="result-card hidden"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
